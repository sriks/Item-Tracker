# SwiftLint configuration for ItemTracker
# https://github.com/realm/SwiftLint

# Paths to ignore
excluded:
  - DerivedData
  - .build
  - Packages
  - "*.generated.swift"
  - ItemTrackerUITests
  - ItemTrackerTests

# Disabled rules (too noisy or not useful)
disabled_rules:
  - trailing_whitespace
  - todo
  - opening_brace # Conflicts with some SwiftUI patterns

# Opt-in rules worth enabling
opt_in_rules:
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - sorted_first_last
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - yoda_condition
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_collection_literal
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: false
  ignores_interpolated_strings: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - to
    - at
    - or
    - on
    - db

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

large_tuple:
  warning: 3
  error: 4

function_parameter_count:
  warning: 6
  error: 8

# Force unwrapping - warn but don't error (sometimes needed)
force_unwrapping:
  severity: warning

# Force try - warn (acceptable in previews)
force_try:
  severity: warning

# Implicitly unwrapped optionals - warn
implicitly_unwrapped_optional:
  severity: warning
  mode: all_except_iboutlets

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 1

# Trailing comma in multi-line collections
trailing_comma:
  mandatory_comma: true

# Custom rules (optional)
custom_rules:
  no_print_in_production:
    name: "No print() in production code"
    regex: "\\bprint\\s*\\("
    match_kinds:
      - identifier
    message: "Consider using os_log or removing print statements"
    severity: warning
    excluded: ".*Tests?\\.swift"
